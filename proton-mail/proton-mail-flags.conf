# Flags for Proton Mail (Electron) on Wayland / Hyprland
# Place user overrides in ~/.config/proton-mail-flags.conf

--ozone-platform-hint=auto
--enable-wayland-ime

# Optional: custom UI scaling for High-DPI screens (e.g. 1.25, 1.5, 2.0)
# --force-device-scale-factor=1.5

# Optional: disable hardware acceleration if experiencing GPU rendering issues
# --disable-gpu
