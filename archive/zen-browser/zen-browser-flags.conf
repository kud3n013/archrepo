# Flags for Zen Browser (Firefox/Gecko) on Wayland / Hyprland
# Place user overrides in ~/.config/zen-browser-flags.conf
#
# Lines starting with # are comments. Blank lines are ignored.
# Lines in KEY=VALUE format are exported as environment variables.
# All other lines are passed as command-line arguments.

# Native Wayland rendering (recommended for Wayland compositors)
MOZ_ENABLE_WAYLAND=1

# Hardware video acceleration via VA-API on Wayland
# MOZ_WAYLAND_USE_VAAPI=1

# Smooth touchpad/trackpad scrolling on X11
# MOZ_USE_XINPUT2=1

# Optional: HiDPI scaling override (e.g. 1.25, 1.5, 2.0)
# GDK_DPI_SCALE=1.5

# Optional: disable WebRender if experiencing GPU rendering issues
# MOZ_WEBRENDER=0
