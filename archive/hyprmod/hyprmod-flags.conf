# ==============================================================================
# HyprMod User & System Flags Configuration
# ==============================================================================
# This configuration file allows setting custom environment variables or CLI
# options passed to HyprMod on startup.
#
# HyprMod is a native GTK4/libadwaita application running on Wayland.
# Lines beginning with '#' are ignored.
# Variable assignments in the form KEY=VALUE will be exported into the environment.
# Other tokens will be appended to the command line invocation.
#
# Examples:
#
# Force Wayland display backend (default):
# GDK_BACKEND=wayland
#
# GTK 4 graphics renderer options (ngl, gl, cairo, vulkan):
# GSK_RENDERER=gl
#
# Force integer DPI scaling factor (e.g. 1 or 2):
# GDK_SCALE=1
#
# Run in debug / verbose mode:
# GTK_DEBUG=interactive
# ==============================================================================
