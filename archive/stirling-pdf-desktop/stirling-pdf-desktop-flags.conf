# Configuration flags for stirling-pdf-desktop
# Lines starting with '#' are ignored. Empty lines are ignored.
# Environment variables can be defined as KEY=VALUE.
# Command-line options can be passed directly.

# --- Titlebar & Window Decoration Theme (KDE Plasma) ---
# Stirling-PDF is a WebKitGTK / GTK3 application. Under Wayland, GTK3 defaults
# to Client-Side Decorations (CSD) with GNOME/GTK styling.
#
# To use native KDE Qt titlebars (Server-Side Decorations drawn directly by KWin
# matching your Breeze, Oxygen, or Klassy Qt window decoration and buttons):
# (This is automatically defaulted when running inside KDE Plasma)
GDK_BACKEND=x11

# Alternatively, to run natively under Wayland with Breeze GTK theme matching:
# GDK_BACKEND=wayland
# GTK_THEME=Breeze
# (or for dark mode)
# GTK_THEME=Breeze-Dark

# --- HiDPI Display Scaling ---
# GDK_SCALE=1
# GDK_DPI_SCALE=1

# --- Hardware Acceleration & Stability Workarounds ---
# Disable WebKitGTK DMA-BUF renderer (prevents blank screens / crashes on NVIDIA and some Wayland setups)
WEBKIT_DISABLE_DMABUF_RENDERER=1

# Disable explicit sync on NVIDIA drivers to prevent Wayland compositor crash loops
__NV_DISABLE_EXPLICIT_SYNC=1
