# Configuration flags and environment variables for Free Download Manager (Qt6)
# Lines starting with '#' are comments and will be ignored.
# Variable assignments (KEY=VALUE) will be exported into the process environment.
# Argument flags (starting with '-') will be passed as command line arguments to fdm.

# Automatic Wayland / X11 platform selection (default when running under Wayland):
# QT_QPA_PLATFORM=wayland;xcb

# Force Wayland native execution (uncomment to bypass XWayland):
# QT_QPA_PLATFORM=wayland

# Force X11 / XWayland execution:
# QT_QPA_PLATFORM=xcb

# Platform theme for desktop portal integration & system dark mode detection:
# Bundled plugins in /opt/freedownloadmanager/plugins/platformthemes are 'xdgdesktopportal' and 'gtk3'.
# 'xdgdesktopportal' provides universal system dark/light theme detection across modern Wayland/X11 desktops.
QT_QPA_PLATFORMTHEME=xdgdesktopportal

# HiDPI / Scaling adjustments:
# QT_AUTO_SCREEN_SCALE_FACTOR=1
# QT_SCALE_FACTOR=1.25

# Wayland window decoration tweaks:
# QT_WAYLAND_DISABLE_WINDOWDECORATION=1
