# Flags for Proton Pass (Electron) on Wayland / Hyprland / Sway / KDE Plasma
# Place user overrides in ~/.config/proton-pass-flags.conf

--ozone-platform-hint=auto
--enable-wayland-ime

# Optional: custom UI scaling for High-DPI screens (e.g. 2.8k / 4k displays)
# --force-device-scale-factor=1.5

# Optional: Chromium password store backend flag
# --password-store=basic
