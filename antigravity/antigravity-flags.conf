# Flags for Google Antigravity (Electron) on Wayland / Hyprland
# Place user overrides in ~/.config/antigravity-flags.conf

--ozone-platform-hint=auto
--enable-wayland-ime

# Optional: Custom UI scaling for High-DPI screens (e.g. 1.5, 2.0)
# --force-device-scale-factor=1.5

# Optional: Disable GPU hardware acceleration if encountering driver rendering glitches
# --disable-gpu
