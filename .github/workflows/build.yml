name: Build & Publish Arch Packages

on:
  schedule:
    - cron: "0 4 * * *"          # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to build (or "all")'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild even if binary already exists in release'
        required: false
        default: false
        type: boolean
      check_upstream:
        description: 'Check for upstream updates before building'
        required: false
        default: false
        type: boolean

permissions:
  contents: read                  # only the publish job gets write access

# Runs share one repository database; overlapping runs would overwrite each
# other's archrepo.db uploads. Queue them instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # Repository signing key; the public half is keys/archrepo.asc
  ARCHREPO_KEY_FPR: CFB791543B4B2D2821E9127AC012A9476C170A37

jobs:
  # ── 1. Discover packages to build ─────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    # Arch container so check-upstream.sh can compare versions with vercmp
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_packages: ${{ steps.discover.outputs.has_packages }}
      count: ${{ steps.discover.outputs.count }}
      repo_maintenance: ${{ steps.discover.outputs.repo_maintenance }}
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm git jq curl github-cli

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover packages
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_PKG: ${{ github.event.inputs.package || 'all' }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          CHECK_UPSTREAM: ${{ github.event.inputs.check_upstream || (github.event_name == 'schedule' && 'true') || 'false' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x .github/scripts/discover.sh .github/scripts/check-upstream.sh
          .github/scripts/discover.sh

  # ── 2. Build packages in Arch Linux container ─────────────────────────
  build:
    needs: discover
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      # ── Install build dependencies inside container ─────────────────
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git sudo jq curl pacman-contrib github-cli

      # ── Checkout main branch ────────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0
          # makepkg runs upstream build code as builder, who owns src/; never
          # leave a token in src/.git/config for it to read.
          persist-credentials: false

      # ── Use archrepo itself for dependencies, signature-checked ─────
      - name: Enable archrepo
        run: |
          pacman-key --add src/keys/archrepo.asc
          pacman-key --lsign-key "$ARCHREPO_KEY_FPR"
          echo -e "\n[archrepo]\nSigLevel = Required\nServer = https://github.com/${{ github.repository }}/releases/download/packages" >> /etc/pacman.conf
          pacman -Sy

      # ── Create unprivileged builder user ────────────────────────────
      - name: Create builder user
        run: |
          id builder &>/dev/null || useradd -m builder
          grep -q '^builder' /etc/sudoers || echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder src
          git config --global --add safe.directory "$(pwd)/src"

      # ── Auto-update PKGBUILD from upstream (if flagged by discover) ──
      - name: Apply upstream update
        id: version
        if: matrix.update_needed == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.name }}"
          chmod +x src/.github/scripts/check-upstream.sh

          # Run check-upstream with --apply
          src/.github/scripts/check-upstream.sh "src/packages/${PKG}" --apply

          # Refresh checksums & .SRCINFO
          cd "src/packages/${PKG}"
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      # ── Check if binary is already published in release ─────────────
      - name: Check existing release binary
        id: cache_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.name }}"
          cd "src/packages/${PKG}"

          PKG_FILE=$(sudo -u builder makepkg --packagelist | sed -n '1p' | xargs basename)
          echo "target_pkg=${PKG_FILE}" >> "$GITHUB_OUTPUT"

          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSETS=$(gh release view packages --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qxF "$PKG_FILE"; then
            echo "⚡ Package ${PKG_FILE} is already published in release 'packages'. Skipping build..."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${PKG_FILE} not found in release. Building with makepkg..."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build package with makepkg ──────────────────────────────────
      - name: Build package
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          cd "src/packages/${{ matrix.name }}"
          # makepkg -s cannot install dependencies missing from the sync repos
          # (e.g. AUR-only). Only in that case install what is available and build
          # with -d; any other failure, including compile errors, fails the step.
          DEPS=$(sudo -u builder makepkg --printsrcinfo | awk -F' = ' '$1 ~ /^\t(make|check)?depends$/ {print $2}')
          UNAVAILABLE=()
          for dep in $DEPS; do
            pacman -Sp --print-format '%n' "$dep" &>/dev/null || UNAVAILABLE+=("$dep")
          done
          if [ ${#UNAVAILABLE[@]} -eq 0 ]; then
            sudo -u builder makepkg -s --noconfirm
          else
            echo "::warning::Not in sync repos, building ${{ matrix.name }} without dependency checks: ${UNAVAILABLE[*]}"
            AVAILABLE=$(printf '%s\n' $DEPS | grep -vxF -f <(printf '%s\n' "${UNAVAILABLE[@]}") || true)
            if [ -n "$AVAILABLE" ]; then
              pacman -S --needed --noconfirm $AVAILABLE
            fi
            sudo -u builder makepkg -d --noconfirm
          fi

      # ── Upload package artifact ─────────────────────────────────────
      - name: Upload package artifact
        if: steps.cache_check.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-pkg
          path: src/packages/${{ matrix.name }}/*.pkg.tar.zst
          if-no-files-found: error

      # ── Hand the upstream update to the publish job ─────────────────
      # This job has no write token; the publish job opens a pull request with
      # these files and merges it only if the build succeeded.
      - name: Upload upstream update
        if: success() && matrix.update_needed == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bump
          path: |
            src/packages/${{ matrix.name }}/PKGBUILD
            src/packages/${{ matrix.name }}/.SRCINFO
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload failed upstream update
        if: failure() && matrix.update_needed == true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bump-failed
          path: |
            src/packages/${{ matrix.name }}/PKGBUILD
            src/packages/${{ matrix.name }}/.SRCINFO
          include-hidden-files: true
          if-no-files-found: warn

  # ── 3. Publish newly built packages & update repository ───────────────
  publish:
    needs: [discover, build]
    if: ${{ !cancelled() && ((needs.discover.outputs.has_packages == 'true' && (needs.build.result == 'success' || needs.build.result == 'failure')) || needs.discover.outputs.repo_maintenance == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write             # push gh-pages and bump branches, manage releases
      pull-requests: write        # open and merge upstream update pull requests
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git pacman-contrib github-cli jq

      - name: Import signing key
        env:
          ARCHREPO_SIGNING_KEY: ${{ secrets.ARCHREPO_SIGNING_KEY }}
        run: |
          if [ -z "$ARCHREPO_SIGNING_KEY" ]; then
            echo "::error::The ARCHREPO_SIGNING_KEY secret is not set"
            exit 1
          fi
          printf '%s\n' "$ARCHREPO_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$ARCHREPO_KEY_FPR"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 0

      - name: Checkout main (for upstream updates, index generation & archive detection)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src
          fetch-depth: 0

      - name: Download built package artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-pkg'
          path: new-pkgs
          merge-multiple: true

      - name: Download upstream updates
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: '*-bump*'
          path: bumps

      # Each upstream update goes through a pull request on bump/<pkg>: merged
      # when its build succeeded, otherwise left open (and updated by later runs)
      # so a failing update stays visible until it is fixed.
      - name: Merge upstream updates via pull requests
        run: |
          compgen -G "bumps/*" > /dev/null || { echo "No upstream updates."; exit 0; }
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cd main_src
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          NOT_MERGED=()
          for bump_dir in ../bumps/*; do
            name=$(basename "$bump_dir")
            case "$name" in
              *-bump-failed) PKG="${name%-bump-failed}"; BUILD_OK=false ;;
              *-bump)        PKG="${name%-bump}";        BUILD_OK=true ;;
              *) continue ;;
            esac
            [ -d "packages/${PKG}" ] || { echo "::warning::Unknown package ${PKG}, skipping"; continue; }
            [ -f "${bump_dir}/PKGBUILD" ] || { echo "::warning::No PKGBUILD for ${PKG}, skipping"; continue; }

            BRANCH="bump/${PKG}"
            git checkout -q -B "$BRANCH" origin/main
            cp "${bump_dir}/PKGBUILD" "packages/${PKG}/"
            [ -f "${bump_dir}/.SRCINFO" ] && cp "${bump_dir}/.SRCINFO" "packages/${PKG}/"
            git add "packages/${PKG}/PKGBUILD" "packages/${PKG}/.SRCINFO"
            if git diff --cached --quiet; then
              echo "No changes for ${PKG}"
              continue
            fi
            VER="$(grep -oP '^pkgver=\K.*' "packages/${PKG}/PKGBUILD")-$(grep -oP '^pkgrel=\K.*' "packages/${PKG}/PKGBUILD")"
            git commit -q -m "bump: ${PKG} ${VER}"
            git push -q -f origin "$BRANCH"

            if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
              gh pr create --base main --head "$BRANCH" --title "bump: ${PKG} ${VER}" \
                --body "Automated upstream update for \`${PKG}\` to \`${VER}\`, built in ${RUN_URL}."
            fi

            if [ "$BUILD_OK" = true ]; then
              merged=false
              # Mergeability is computed asynchronously right after the PR is created
              for i in 1 2 3 4 5; do
                if gh pr merge "$BRANCH" --squash --delete-branch; then
                  merged=true
                  break
                fi
                sleep 5
              done
              [ "$merged" = true ] || NOT_MERGED+=("$PKG")
            else
              gh pr comment "$BRANCH" --body "❌ Build of \`${PKG} ${VER}\` failed: ${RUN_URL}. This PR stays open until a build of the update succeeds."
              NOT_MERGED+=("$PKG")
            fi
          done

          git checkout -q main
          git pull -q --ff-only origin main
          if [ ${#NOT_MERGED[@]} -gt 0 ]; then
            echo "::warning::Upstream updates left open as pull requests: ${NOT_MERGED[*]}"
          fi

      - name: Update repository database
        run: |
          mkdir -p repo/x86_64
          cd repo/x86_64

          # Sign every package in the current directory that has no signature yet
          sign_missing() {
            local pkg
            for pkg in *.pkg.tar.zst; do
              [ -e "$pkg" ] || continue
              [ -f "${pkg}.sig" ] || gpg --batch --yes --detach-sign --local-user "$ARCHREPO_KEY_FPR" "$pkg"
            done
          }

          # 1. Fallback: if database file does not exist, fetch all existing packages
          if [ ! -f archrepo.db.tar.gz ]; then
            echo "archrepo.db.tar.gz not found on gh-pages. Fetching from release 'packages'..."
            gh release download packages --pattern "*.pkg.tar.zst" || true
            gh release download packages --pattern "*.pkg.tar.zst.sig" || true
            sign_missing
            repo-add --sign --key "$ARCHREPO_KEY_FPR" archrepo.db.tar.gz *.pkg.tar.zst
          fi

          # 2. Sign and add newly built packages incrementally
          if [ -d ../../new-pkgs ] && compgen -G "../../new-pkgs/*.pkg.tar.zst" > /dev/null; then
            echo "Adding newly built packages to database..."
            cp -f ../../new-pkgs/*.pkg.tar.zst .
            sign_missing
            repo-add --sign --key "$ARCHREPO_KEY_FPR" archrepo.db.tar.gz *.pkg.tar.zst
          fi

          # 3. Purge packages that are no longer active (archived, stale debug packages).
          #    Database entries are <name>-<ver>-<rel>; every pkgname matches its packages/ dir.
          ACTIVE=$(ls ../../main_src/packages)
          [ -n "$ACTIVE" ] || { echo "::error::No active packages found"; exit 1; }
          for entry in $(tar -tzf archrepo.db.tar.gz | grep '/$' | tr -d '/'); do
            name="${entry%-*-*}"
            if ! grep -qxF "$name" <<< "$ACTIVE"; then
              echo "Inactive package in database: ${name}. Purging..."
              repo-remove --sign --key "$ARCHREPO_KEY_FPR" archrepo.db.tar.gz "$name"
              rm -f "${entry}"-*.pkg.tar.zst "${entry}"-*.pkg.tar.zst.sig
            fi
          done

          # 4. Backfill signatures for active packages published before signing was
          #    enabled, re-adding them so the database carries their signatures too.
          #    Release packages that aren't in the database are pruned after upload.
          mkdir -p ../../backfill
          ASSETS=$(gh release view packages --json assets --jq '.assets[].name')
          DB_ENTRIES=$(tar -tzf archrepo.db.tar.gz | grep '/$' | tr -d '/')
          for asset in $ASSETS; do
            [[ "$asset" == *.pkg.tar.zst ]] || continue
            grep -qxF "${asset}.sig" <<< "$ASSETS" && continue
            [ -f "${asset}.sig" ] && continue
            base="${asset%.pkg.tar.zst}"
            grep -qxF "${base%-*-*-*}" <<< "$ACTIVE" || continue
            grep -qxF "${base%-*}" <<< "$DB_ENTRIES" || continue
            echo "Signing previously unsigned release asset: $asset"
            gh release download packages --pattern "$asset" --dir ../../backfill --clobber
            gpg --batch --yes --detach-sign --local-user "$ARCHREPO_KEY_FPR" "../../backfill/${asset}"
            repo-add --sign --key "$ARCHREPO_KEY_FPR" archrepo.db.tar.gz "../../backfill/${asset}"
            rm -f "../../backfill/${asset}"
          done

          # 5. Make sure the database is signed even when nothing above changed it
          for db in archrepo.db.tar.gz archrepo.files.tar.gz; do
            [ -f "${db}.sig" ] || gpg --batch --yes --detach-sign --local-user "$ARCHREPO_KEY_FPR" "$db"
          done

          # 6. Replace symlinks with real files for GitHub Releases
          rm -f archrepo.db archrepo.files archrepo.db.sig archrepo.files.sig
          cp archrepo.db.tar.gz archrepo.db
          cp archrepo.files.tar.gz archrepo.files
          cp archrepo.db.tar.gz.sig archrepo.db.sig
          cp archrepo.files.tar.gz.sig archrepo.files.sig

      - name: Publish all packages to GitHub Releases
        run: |
          gh release view packages || \
            gh release create packages --title "Arch Repository Packages" --notes "Automated repository packages" --prerelease=false

          # Public signing key at a stable URL for users' pacman-key --add
          gh release upload packages --clobber main_src/keys/archrepo.asc

          # Signatures for previously unsigned packages
          if compgen -G "backfill/*.sig" > /dev/null; then
            gh release upload packages --clobber backfill/*.sig
          fi

          cd repo/x86_64

          # Upload newly built packages, their signatures and updated database files
          if compgen -G "*.pkg.tar.zst" > /dev/null; then
            gh release upload packages --clobber *.pkg.tar.zst *.pkg.tar.zst.sig archrepo.db* archrepo.files*
          else
            gh release upload packages --clobber archrepo.db* archrepo.files*
          fi

          # Prune release packages (and signatures) the database no longer references:
          # superseded versions, archived packages, stale debug packages.
          # An asset is <name>-<ver>-<rel>-<arch>.pkg.tar.zst; the database lists <name>-<ver>-<rel>.
          DB_ENTRIES=$(tar -tzf archrepo.db.tar.gz | grep '/$' | tr -d '/')
          if [ "$(grep -c . <<< "$DB_ENTRIES")" -lt 5 ]; then
            echo "::error::Database lists fewer than 5 packages; refusing to prune release assets"
            exit 1
          fi
          for asset in $(gh release view packages --json assets --jq '.assets[].name'); do
            [[ "$asset" == *.pkg.tar.zst || "$asset" == *.pkg.tar.zst.sig ]] || continue
            base="${asset%.sig}"
            base="${base%.pkg.tar.zst}"
            if ! grep -qxF "${base%-*}" <<< "$DB_ENTRIES"; then
              echo "Removing release asset not in database: $asset"
              gh release delete-asset packages "$asset" --yes
            fi
          done

      - name: Update GitHub Pages landing page
        run: |
          cd repo/x86_64
          # Keep only database files in git repo
          rm -f *.pkg.tar.zst *.pkg.tar.zst.sig
          cd ..
          chmod +x ../main_src/.github/scripts/generate-index.sh
          ../main_src/.github/scripts/generate-index.sh ../main_src index.html

      - name: Push updates to gh-pages
        run: |
          cd repo
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update repository database and packages" || echo "Nothing to commit"
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin gh-pages && git push origin gh-pages; then
              pushed=true
              break
            fi
            sleep 3
          done
          [ "$pushed" = true ] || { echo "::error::Failed to push to gh-pages"; exit 1; }
