name: Build & Publish Arch Packages

on:
  schedule:
    - cron: "0 4 * * *"          # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to build (or "all")'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild even if binary already exists in release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write                 # push commits to main + gh-pages, manage releases

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: proton-mail-bin
            upstream_repo: ""
            upstream_check: proton-redirect
          - name: zalo-for-linux-bin
            upstream_repo: doandat943/zalo-for-linux
            upstream_check: github-release
          - name: beeper-bin
            upstream_repo: ""
            upstream_check: beeper-redirect
          - name: proton-pass-bin
            upstream_repo: ""
            upstream_check: proton-pass-api

    steps:
      # ── 0. Check if this package should run ───────────────────────────
      - name: Check package filter
        id: filter
        run: |
          TARGET="${{ github.event.inputs.package || 'all' }}"
          CURRENT="${{ matrix.package.name }}"
          if [ "$TARGET" != "all" ] && [ "$TARGET" != "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${CURRENT} (target: ${TARGET})"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 1. Install dependencies inside container ──────────────────────
      - name: Install dependencies
        if: steps.filter.outputs.skip != 'true'
        run: |
          pacman -Syu --noconfirm git sudo jq curl pacman-contrib github-cli

      # ── 2. Checkout main branch ───────────────────────────────────────
      - name: Checkout main
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0

      # ── 3. Create unprivileged builder user ──────────────────────────
      - name: Create builder user
        if: steps.filter.outputs.skip != 'true'
        run: |
          id builder &>/dev/null || useradd -m builder
          grep -q '^builder' /etc/sudoers || echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder src
          git config --global --add safe.directory "$(pwd)/src"

      # ── 4. Auto-update PKGBUILD version from upstream ────────────────
      - name: Check for new upstream release
        if: steps.filter.outputs.skip != 'true'
        id: version
        run: |
          PKG="${{ matrix.package.name }}"
          CHECK="${{ matrix.package.upstream_check }}"
          UPSTREAM="${{ matrix.package.upstream_repo }}"

          CURRENT=$(grep -oP '^pkgver=\K.*' "src/${PKG}/PKGBUILD")
          LATEST="$CURRENT"
          UPDATE_NEEDED=false

          if [ "$CHECK" = "github-release" ] && [ -n "$UPSTREAM" ]; then
            RELEASE_JSON=$(curl -s "https://api.github.com/repos/${UPSTREAM}/releases/latest" || true)
            TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name' 2>/dev/null || true)
            TAG="${TAG#v}"
            [ -n "$TAG" ] && [ "$TAG" != "null" ] && LATEST="$TAG"

            # For zalo-for-linux-bin: match clean upstream asset Zalo-<ver>-<commit>.AppImage
            if [ "$PKG" = "zalo-for-linux-bin" ]; then
              ASSET=$(echo "$RELEASE_JSON" | jq -r '.assets[].name' | grep -E '^Zalo-[0-9.]+-([0-9a-fA-F]+)\.AppImage$' | head -1 || true)
              if [ -n "$ASSET" ]; then
                COMMIT=$(echo "$ASSET" | grep -oP '\-\K[0-9a-fA-F]+(?=\.AppImage)' || true)
                CURRENT_COMMIT=$(grep -oP '^_commithash=\K.*' "src/${PKG}/PKGBUILD" || true)
                if [ -n "$COMMIT" ] && [ "$COMMIT" != "$CURRENT_COMMIT" ]; then
                  sed -i "s/^_commithash=.*/_commithash=${COMMIT}/" "src/${PKG}/PKGBUILD"
                  UPDATE_NEEDED=true
                  echo "Updated commit hash: ${CURRENT_COMMIT} → ${COMMIT}"
                fi
              fi
            fi

          elif [ "$CHECK" = "proton-redirect" ]; then
            HEADERS=$(curl -sI "https://proton.me/download/mail/linux/ProtonMail-desktop-beta.deb" || true)
            VER=$(echo "$HEADERS" | grep -i '^location:' | grep -oP '/\K[0-9]+\.[0-9]+\.[0-9]+(?=/)' || true)
            [ -n "$VER" ] && LATEST="$VER"
          elif [ "$CHECK" = "beeper-redirect" ]; then
            HEADERS=$(curl -sI "https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop" || true)
            VER=$(echo "$HEADERS" | grep -i '^location:' | grep -oP 'Beeper-\K[0-9.]+(?=-x86_64\.AppImage)' || true)
            [ -n "$VER" ] && LATEST="$VER"
          elif [ "$CHECK" = "proton-pass-api" ]; then
            PASS_JSON=$(curl -sL "https://proton.me/download/pass/linux/version.json" || true)
            VER=$(echo "$PASS_JSON" | jq -r '.Releases[] | select(.CategoryName=="Stable") | .Version' 2>/dev/null | head -1 || true)
            [ -n "$VER" ] && [ "$VER" != "null" ] && LATEST="$VER"
          fi

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ] || [ "$UPDATE_NEEDED" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i "s/^pkgver=.*/pkgver=${LATEST}/" "src/${PKG}/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=1/"          "src/${PKG}/PKGBUILD"
            echo "📦 Updated ${PKG} pkgver: ${CURRENT} → ${LATEST}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ ${PKG} already at latest version ${CURRENT}"
          fi

      # ── 5. Refresh checksums & .SRCINFO if version changed ───────────
      - name: Update checksums & .SRCINFO
        if: steps.filter.outputs.skip != 'true' && steps.version.outputs.changed == 'true'
        run: |
          cd "src/${{ matrix.package.name }}"
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      # ── 6. Push updated PKGBUILD → main ─────────────────────────────
      - name: Commit PKGBUILD changes to main
        if: steps.filter.outputs.skip != 'true' && steps.version.outputs.changed == 'true'
        run: |
          PKG="${{ matrix.package.name }}"
          cd src
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PKG}/PKGBUILD" "${PKG}/.SRCINFO"
          git commit -m "bump: ${PKG} ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.latest }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep 3
          done

      # ── 7. Check if binary is already published in release ───────────
      - name: Check existing release binary
        if: steps.filter.outputs.skip != 'true'
        id: cache_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.package.name }}"
          cd "src/${PKG}"

          # Compute the exact filename makepkg will produce
          PKG_FILE=$(sudo -u builder makepkg --packagelist | head -1 | xargs basename)
          echo "target_pkg=${PKG_FILE}" >> "$GITHUB_OUTPUT"

          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if this exact package exists in the GitHub Release
          ASSETS=$(gh release view packages --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qxF "$PKG_FILE"; then
            echo "⚡ Package ${PKG_FILE} is already published in release 'packages'. Skipping build..."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${PKG_FILE} not found in release. Building with makepkg..."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # ── 8. Build package with makepkg if not cached ──────────────────
      - name: Build package
        if: steps.filter.outputs.skip != 'true' && steps.cache_check.outputs.skip_build != 'true'
        run: |
          cd "src/${{ matrix.package.name }}"
          sudo -u builder makepkg -s --noconfirm

      # ── 9. Upload package artifact for publish job ───────────────────
      - name: Upload package artifact
        if: steps.filter.outputs.skip != 'true' && steps.cache_check.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package.name }}-pkg
          path: src/${{ matrix.package.name }}/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git pacman-contrib github-cli jq

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 0

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: all-pkgs
          merge-multiple: true

      - name: Update repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo/x86_64
          cd repo/x86_64

          # 1. Download existing packages from GitHub Releases so we never lose already published packages
          echo "Fetching existing packages from release 'packages'..."
          gh release download packages --pattern "*.pkg.tar.zst" --repo ${{ github.repository }} || true

          # 2. Copy newly built packages from workflow artifacts
          if [ -d ../../all-pkgs ] && compgen -G "../../all-pkgs/*.pkg.tar.zst" > /dev/null; then
            echo "Copying newly built package artifacts..."
            cp -f ../../all-pkgs/*.pkg.tar.zst .
          fi

          # Keep newest package version for each package name
          PKGS=$(ls *.pkg.tar.zst 2>/dev/null | sed -E 's/-[0-9]+.*//' | sort -u || true)
          for pkg in $PKGS; do
            LATEST_PKG=$(ls -t ${pkg}-*.pkg.tar.zst 2>/dev/null | head -1 || true)
            for f in ${pkg}-*.pkg.tar.zst; do
              [ "$f" != "$LATEST_PKG" ] && [ -f "$f" ] && rm -f "$f"
            done
          done

          # Rebuild pacman repository database
          rm -f archrepo.db* archrepo.files*
          repo-add archrepo.db.tar.gz *.pkg.tar.zst

          # Replace symlinks with real files for GitHub Releases
          rm -f archrepo.db archrepo.files
          cp archrepo.db.tar.gz archrepo.db
          cp archrepo.files.tar.gz archrepo.files

      - name: Publish all packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure 'packages' release exists
          gh release view packages --repo ${{ github.repository }} || \
            gh release create packages --title "Arch Repository Packages" --notes "Automated repository packages" --prerelease=false --repo ${{ github.repository }}

          # Upload packages and database files (bypasses 100MB limit)
          cd repo/x86_64
          gh release upload packages --clobber --repo ${{ github.repository }} *.pkg.tar.zst archrepo.db* archrepo.files*

          # Remove superseded package assets from the GitHub Release
          RELEASE_ASSETS=$(gh release view packages --repo ${{ github.repository }} --json assets --jq '.assets[].name' || true)
          for asset in $RELEASE_ASSETS; do
            if [[ "$asset" == *.pkg.tar.zst ]] && [ ! -f "$asset" ]; then
              echo "Removing outdated release asset: $asset"
              gh release delete-asset packages "$asset" --yes --repo ${{ github.repository }} || true
            fi
          done

      - name: Prepare gh-pages branch
        run: |
          cd repo/x86_64
          # Packages are hosted on GitHub Releases; keep only the database files in git to save repo space
          rm -f *.pkg.tar.zst

          # Create landing page for GitHub Pages
          cat << 'EOF' > ../index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>archrepo - Arch Linux Repository</title>
            <style>
              body { font-family: system-ui, -apple-system, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; color: #24292f; }
              pre { background: #f6f8fa; padding: 16px; border-radius: 6px; overflow-x: auto; border: 1px solid #d0d7de; }
              code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
              h1 { color: #0969da; }
            </style>
          </head>
          <body>
            <h1>📦 archrepo</h1>
            <p>Automated Arch Linux package repository hosted on GitHub.</p>
            <h2>Installation</h2>
            <p>Add the repository to <code>/etc/pacman.conf</code>:</p>
            <pre><code>[archrepo]
          SigLevel = Optional TrustAll
          Server = https://github.com/kud3n013/archrepo/releases/download/packages</code></pre>
            <p>Then synchronize package databases:</p>
            <pre><code>sudo pacman -Syy</code></pre>
            <h2>Available Packages</h2>
            <ul>
              <li><code>proton-mail-bin</code> - Proton Mail official desktop client</li>
              <li><code>proton-pass-bin</code> - Proton Pass official desktop application</li>
              <li><code>zalo-for-linux-bin</code> - Zalo for Linux (with Wayland support)</li>
              <li><code>beeper-bin</code> - Beeper unified messenger (formerly Beeper v4)</li>
            </ul>
          </body>
          </html>
          EOF

      - name: Push updates to gh-pages
        run: |
          cd repo
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update repository database and packages" || echo "Nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages && git push origin gh-pages && break
            sleep 3
          done
