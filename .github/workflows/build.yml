name: Build & Publish Arch Packages

on:
  schedule:
    - cron: "0 4 * * *"          # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write                 # push commits to main + gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      # ── 0. Install runtime deps inside the container ──────────────────
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git sudo jq curl pacman-contrib

      # ── 1. Checkout both branches ────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 0

      # ── 2. Create unprivileged builder user ──────────────────────────
      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder src repo
          git config --global --add safe.directory "$(pwd)/src"
          git config --global --add safe.directory "$(pwd)/repo"

      # ── 3. Auto-update PKGBUILD version from upstream ────────────────
      - name: Check for new upstream release
        id: version
        run: |
          # Fetch the redirect headers and extract the version from the URL
          HEADERS=$(curl -sI "https://proton.me/download/mail/linux/ProtonMail-desktop-beta.deb" || true)
          LATEST=$(echo "$HEADERS" | grep -i '^location:' | grep -oP '/\K[0-9]+\.[0-9]+\.[0-9]+(?=/)' || true)

          if [ -z "$LATEST" ]; then
            echo "::warning::Could not determine latest version from redirect, falling back to PKGBUILD version"
            LATEST=$(grep -oP '^pkgver=\K.*' src/proton-mail-bin/PKGBUILD)
          fi

          CURRENT=$(grep -oP '^pkgver=\K.*' src/proton-mail-bin/PKGBUILD)

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i "s/^pkgver=.*/pkgver=${LATEST}/" src/proton-mail-bin/PKGBUILD
            sed -i "s/^pkgrel=.*/pkgrel=1/"          src/proton-mail-bin/PKGBUILD
            echo "📦 Updated pkgver: ${CURRENT} → ${LATEST}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Already at latest version ${CURRENT}"
          fi

      # ── 4. Refresh checksums & .SRCINFO ──────────────────────────────
      - name: Update checksums & .SRCINFO
        if: steps.version.outputs.changed == 'true'
        run: |
          cd src/proton-mail-bin
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      # ── 5. Build the package ─────────────────────────────────────────
      - name: Build package
        run: |
          cd src/proton-mail-bin
          sudo -u builder makepkg -s --noconfirm

      # ── 6. Update repo database ─────────────────────────────────────
      - name: Update repository database
        run: |
          mkdir -p repo/x86_64

          # Copy newly built package(s) into the repo directory
          cp src/proton-mail-bin/*.pkg.tar.zst repo/x86_64/

          # Identify the package we just built (resolve before cd)
          NEW_PKG=$(ls -t src/proton-mail-bin/*.pkg.tar.zst 2>/dev/null | head -1 | xargs basename)

          cd repo/x86_64

          # Remove older versions of the same package (keep only the new one)
          for f in proton-mail-bin-*.pkg.tar.zst; do
            [ "$f" = "$NEW_PKG" ] && continue
            [ "$f" = 'proton-mail-bin-*.pkg.tar.zst' ] && continue  # glob didn't match
            echo "Removing old package: $f"
            rm -f "$f"
          done

          # Rebuild the database from scratch
          rm -f archrepo.db* archrepo.files*
          repo-add archrepo.db.tar.gz *.pkg.tar.zst

      # ── 7. Push updated PKGBUILD → main ─────────────────────────────
      - name: Commit PKGBUILD changes to main
        if: steps.version.outputs.changed == 'true'
        run: |
          cd src
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add proton-mail-bin/PKGBUILD proton-mail-bin/.SRCINFO
          git commit -m "bump: proton-mail-bin ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.latest }}"
          git push origin main

      # ── 8. Push binaries + DB → gh-pages ─────────────────────────────
      - name: Commit & push to gh-pages
        run: |
          cd repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update proton-mail-bin to ${{ steps.version.outputs.latest }}" || echo "Nothing to commit"
          git push origin gh-pages
