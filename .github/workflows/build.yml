name: Build & Publish Arch Packages

on:
  schedule:
    - cron: "0 4 * * *"          # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write                 # push commits to main + gh-pages

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        package:
          - name: proton-mail-bin
            upstream_repo: ""
            upstream_check: proton-redirect
          - name: zalux-bin
            upstream_repo: doandat943/zalo-for-linux
            upstream_check: github-release

    steps:
      # ── 0. Install runtime deps inside the container ──────────────────
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git sudo jq curl pacman-contrib

      # ── 1. Checkout both branches ────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 0

      # ── 2. Create unprivileged builder user ──────────────────────────
      - name: Create builder user
        run: |
          id builder &>/dev/null || useradd -m builder
          grep -q '^builder' /etc/sudoers || echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder src repo
          git config --global --add safe.directory "$(pwd)/src"
          git config --global --add safe.directory "$(pwd)/repo"

      # ── 3. Auto-update PKGBUILD version from upstream ────────────────
      - name: Check for new upstream release
        id: version
        run: |
          PKG="${{ matrix.package.name }}"
          CHECK="${{ matrix.package.upstream_check }}"
          UPSTREAM="${{ matrix.package.upstream_repo }}"

          CURRENT=$(grep -oP '^pkgver=\K.*' "src/${PKG}/PKGBUILD")
          LATEST="$CURRENT"

          if [ "$CHECK" = "github-release" ] && [ -n "$UPSTREAM" ]; then
            TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM}/releases/latest" | jq -r '.tag_name' || true)
            TAG="${TAG#v}"
            [ -n "$TAG" ] && [ "$TAG" != "null" ] && LATEST="$TAG"
          elif [ "$CHECK" = "proton-redirect" ]; then
            HEADERS=$(curl -sI "https://proton.me/download/mail/linux/ProtonMail-desktop-beta.deb" || true)
            VER=$(echo "$HEADERS" | grep -i '^location:' | grep -oP '/\K[0-9]+\.[0-9]+\.[0-9]+(?=/)' || true)
            [ -n "$VER" ] && LATEST="$VER"
          fi

          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          if [ "$LATEST" != "$CURRENT" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            sed -i "s/^pkgver=.*/pkgver=${LATEST}/" "src/${PKG}/PKGBUILD"
            sed -i "s/^pkgrel=.*/pkgrel=1/"          "src/${PKG}/PKGBUILD"

            # For zalux-bin, also update _zadarkver and _commithash from the release asset name
            if [ "$PKG" = "zalux-bin" ] && [ "$CHECK" = "github-release" ]; then
              ASSET=$(curl -s "https://api.github.com/repos/${UPSTREAM}/releases/latest" \
                      | jq -r '.assets[].name' | grep 'ZaDark.AppImage$' | head -1 || true)
              if [ -n "$ASSET" ]; then
                ZADARK_VER=$(echo "$ASSET" | grep -oP 'ZaDark-\K[0-9]+\.[0-9]+\.[0-9]+' || true)
                COMMIT=$(echo "$ASSET" | grep -oP '\-\K[a-f0-9]{7}(?=-ZaDark)' || true)
                [ -n "$ZADARK_VER" ] && sed -i "s/^_zadarkver=.*/_zadarkver=${ZADARK_VER}/" "src/${PKG}/PKGBUILD"
                [ -n "$COMMIT" ] && sed -i "s/^_commithash=.*/_commithash=${COMMIT}/" "src/${PKG}/PKGBUILD"
              fi
            fi

            echo "📦 Updated ${PKG} pkgver: ${CURRENT} → ${LATEST}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ ${PKG} already at latest version ${CURRENT}"
          fi

      # ── 4. Refresh checksums & .SRCINFO ──────────────────────────────
      - name: Update checksums & .SRCINFO
        if: steps.version.outputs.changed == 'true'
        run: |
          cd "src/${{ matrix.package.name }}"
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

      # ── 5. Build the package ─────────────────────────────────────────
      - name: Build package
        run: |
          cd "src/${{ matrix.package.name }}"
          sudo -u builder makepkg -s --noconfirm

      # ── 6. Update repo database ─────────────────────────────────────
      - name: Update repository database
        run: |
          PKG="${{ matrix.package.name }}"
          mkdir -p repo/x86_64

          # Copy newly built package(s) into the repo directory
          cp "src/${PKG}/"*.pkg.tar.zst repo/x86_64/

          # Identify the package we just built (resolve before cd)
          NEW_PKG=$(ls -t "src/${PKG}/"*.pkg.tar.zst 2>/dev/null | head -1 | xargs basename)

          cd repo/x86_64

          # Remove older versions of the same package (keep only the new one)
          for f in ${PKG}-*.pkg.tar.zst; do
            [ "$f" = "$NEW_PKG" ] && continue
            [[ "$f" == *'*'* ]] && continue  # glob didn't match anything
            echo "Removing old package: $f"
            rm -f "$f"
          done

          # Rebuild the database from scratch
          rm -f archrepo.db* archrepo.files*
          repo-add archrepo.db.tar.gz *.pkg.tar.zst

      # ── 7. Push updated PKGBUILD → main ─────────────────────────────
      - name: Commit PKGBUILD changes to main
        if: steps.version.outputs.changed == 'true'
        run: |
          PKG="${{ matrix.package.name }}"
          cd src
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${PKG}/PKGBUILD" "${PKG}/.SRCINFO"
          git commit -m "bump: ${PKG} ${{ steps.version.outputs.current }} → ${{ steps.version.outputs.latest }}"
          git push origin main

      # ── 8. Push binaries + DB → gh-pages ─────────────────────────────
      - name: Commit & push to gh-pages
        run: |
          PKG="${{ matrix.package.name }}"
          cd repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin gh-pages || true
          git add -A
          git commit -m "repo: update ${PKG} to ${{ steps.version.outputs.latest }}" || echo "Nothing to commit"
          git push origin gh-pages
