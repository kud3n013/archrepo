name: Build & Publish Arch Packages

on:
  schedule:
    - cron: "0 4 * * *"          # every day at 04:00 UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Specific package to build (or "all")'
        required: false
        default: 'all'
      force_rebuild:
        description: 'Force rebuild even if binary already exists in release'
        required: false
        default: false
        type: boolean
      check_upstream:
        description: 'Check for upstream updates before building'
        required: false
        default: false
        type: boolean

permissions:
  contents: write                 # push commits to main + gh-pages, manage releases

jobs:
  # ── 1. Discover packages to build ─────────────────────────────────────
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      has_packages: ${{ steps.discover.outputs.has_packages }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Discover packages
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_PKG: ${{ github.event.inputs.package || 'all' }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          CHECK_UPSTREAM: ${{ github.event.inputs.check_upstream || (github.event_name == 'schedule' && 'true') || 'false' }}
        run: |
          chmod +x .github/scripts/discover.sh .github/scripts/check-upstream.sh
          .github/scripts/discover.sh

  # ── 2. Build packages in Arch Linux container ─────────────────────────
  build:
    needs: discover
    if: needs.discover.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      # ── Install build dependencies inside container ─────────────────
      - name: Install dependencies
        run: |
          echo -e "\n[archrepo]\nSigLevel = Optional TrustAll\nServer = https://github.com/${{ github.repository }}/releases/download/packages" >> /etc/pacman.conf
          pacman -Syu --noconfirm git sudo jq curl pacman-contrib github-cli

      # ── Checkout main branch ────────────────────────────────────────
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: src
          fetch-depth: 0

      # ── Create unprivileged builder user ────────────────────────────
      - name: Create builder user
        run: |
          id builder &>/dev/null || useradd -m builder
          grep -q '^builder' /etc/sudoers || echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder src
          git config --global --add safe.directory "$(pwd)/src"

      # ── Auto-update PKGBUILD from upstream (if flagged by discover) ──
      - name: Apply upstream update
        id: version
        if: matrix.update_needed == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.name }}"
          chmod +x src/.github/scripts/check-upstream.sh
          
          # Run check-upstream with --apply
          src/.github/scripts/check-upstream.sh "src/packages/${PKG}" --apply

          # Refresh checksums & .SRCINFO
          cd "src/packages/${PKG}"
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO

          # Commit PKGBUILD changes to main
          cd "${GITHUB_WORKSPACE:-$(pwd)/../../..}/src"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "packages/${PKG}/PKGBUILD" "packages/${PKG}/.SRCINFO"
          git commit -m "bump: ${PKG} automated update"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep 3
          done

      # ── Check if binary is already published in release ─────────────
      - name: Check existing release binary
        id: cache_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PKG="${{ matrix.name }}"
          cd "src/packages/${PKG}"

          PKG_FILE=$(sudo -u builder makepkg --packagelist | head -1 | xargs basename)
          echo "target_pkg=${PKG_FILE}" >> "$GITHUB_OUTPUT"

          FORCE="${{ github.event.inputs.force_rebuild || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "Force rebuild requested."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSETS=$(gh release view packages --repo ${{ github.repository }} --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$ASSETS" | grep -qxF "$PKG_FILE"; then
            echo "⚡ Package ${PKG_FILE} is already published in release 'packages'. Skipping build..."
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Package ${PKG_FILE} not found in release. Building with makepkg..."
            echo "skip_build=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Build package with makepkg ──────────────────────────────────
      - name: Build package
        if: steps.cache_check.outputs.skip_build != 'true'
        run: |
          cd "src/packages/${{ matrix.name }}"
          if ! sudo -u builder makepkg -s --noconfirm; then
            echo "makepkg -s failed (likely external/AUR runtime dependencies). Installing makedepends and retrying with -d..."
            MAKEDEPS=$(sudo -u builder makepkg --printsrcinfo | awk -F' = ' '$1 ~ /makedepends/ {print $2}')
            if [ -n "$MAKEDEPS" ]; then
              pacman -S --needed --noconfirm $MAKEDEPS
            fi
            sudo -u builder makepkg -d --noconfirm
          fi

      # ── Upload package artifact ─────────────────────────────────────
      - name: Upload package artifact
        if: steps.cache_check.outputs.skip_build != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-pkg
          path: src/packages/${{ matrix.name }}/*.pkg.tar.zst
          if-no-files-found: error

  # ── 3. Publish newly built packages & update repository ───────────────
  publish:
    needs: [discover, build]
    if: needs.discover.outputs.has_packages == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git pacman-contrib github-cli jq

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: repo
          fetch-depth: 0

      - name: Checkout main (for index generation & archive detection)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_src

      - name: Download built package artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: new-pkgs
          merge-multiple: true

      - name: Update repository database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p repo/x86_64
          cd repo/x86_64

          # 1. Fallback: if database file does not exist, fetch all existing packages
          if [ ! -f archrepo.db.tar.gz ]; then
            echo "archrepo.db.tar.gz not found on gh-pages. Fetching from release 'packages'..."
            gh release download packages --pattern "*.pkg.tar.zst" --repo ${{ github.repository }} || true
            repo-add archrepo.db.tar.gz *.pkg.tar.zst
          fi

          # 2. Add newly built packages incrementally
          if [ -d ../../new-pkgs ] && compgen -G "../../new-pkgs/*.pkg.tar.zst" > /dev/null; then
            echo "Adding newly built packages to database..."
            cp -f ../../new-pkgs/*.pkg.tar.zst .
            repo-add archrepo.db.tar.gz *.pkg.tar.zst
          fi

          # 3. Purge archived packages if present in main_src/archive
          if [ -d ../../main_src/archive ]; then
            for arch_dir in ../../main_src/archive/*; do
              if [ -d "$arch_dir" ]; then
                arch_pkg=$(basename "$arch_dir")
                echo "Archived package detected: ${arch_pkg}. Purging from database..."
                repo-remove archrepo.db.tar.gz "$arch_pkg" || true
                rm -f ${arch_pkg}-[0-9]*.pkg.tar.zst ${arch_pkg}-bin-[0-9]*.pkg.tar.zst
              fi
            done
          fi

          # 4. Replace symlinks with real files for GitHub Releases
          rm -f archrepo.db archrepo.files
          cp archrepo.db.tar.gz archrepo.db
          cp archrepo.files.tar.gz archrepo.files

      - name: Publish all packages to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view packages --repo ${{ github.repository }} || \
            gh release create packages --title "Arch Repository Packages" --notes "Automated repository packages" --prerelease=false --repo ${{ github.repository }}

          cd repo/x86_64

          # Upload newly built packages and updated database files
          if compgen -G "*.pkg.tar.zst" > /dev/null; then
            gh release upload packages --clobber --repo ${{ github.repository }} *.pkg.tar.zst archrepo.db* archrepo.files*
          else
            gh release upload packages --clobber --repo ${{ github.repository }} archrepo.db* archrepo.files*
          fi

          # Remove superseded versions of the packages that were updated
          if [ -d ../../new-pkgs ] && compgen -G "../../new-pkgs/*.pkg.tar.zst" > /dev/null; then
            ALL_RELEASE_ASSETS=$(gh release view packages --repo ${{ github.repository }} --json assets --jq '.assets[].name' || true)
            for new_pkg in ../../new-pkgs/*.pkg.tar.zst; do
              pkg_base=$(basename "$new_pkg")
              pkg_name=$(echo "$pkg_base" | sed -E 's/-[0-9].*//')
              for asset in $ALL_RELEASE_ASSETS; do
                if [[ "$asset" == ${pkg_name}-[0-9]*.pkg.tar.zst ]] && [ "$asset" != "$pkg_base" ]; then
                  echo "Removing superseded release asset: $asset"
                  gh release delete-asset packages "$asset" --yes --repo ${{ github.repository }} || true
                fi
              done
            done
          fi

      - name: Update GitHub Pages landing page
        run: |
          cd repo/x86_64
          # Keep only database files in git repo
          rm -f *.pkg.tar.zst
          cd ..
          chmod +x ../main_src/.github/scripts/generate-index.sh
          ../main_src/.github/scripts/generate-index.sh ../main_src index.html

      - name: Push updates to gh-pages
        run: |
          cd repo
          git config --global --add safe.directory "$(pwd)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "repo: update repository database and packages" || echo "Nothing to commit"
          for i in 1 2 3 4 5; do
            git pull --rebase origin gh-pages && git push origin gh-pages && break
            sleep 3
          done
