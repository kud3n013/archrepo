# Configuration flags and environment variables for Zed (KDE Global Menu edition)
# Lines starting with '#' are ignored. Empty lines are ignored.
#
# CLI Flags (uncomment to activate):
# --foreground
# --wait
#
# Environment variables (KEY=VALUE syntax is automatically exported):
# ZED_WINDOW_DECORATIONS=server
# ZED_WINDOW_DECORATIONS=client
# WAYLAND_DISPLAY=""
