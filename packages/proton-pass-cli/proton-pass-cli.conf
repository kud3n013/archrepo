# Proton Pass CLI Configuration (/etc/proton-pass-cli.conf)
# User overrides can be placed in ~/.config/proton-pass-cli.conf

# Keyring backend for storing session encryption keys on Linux.
# Options:
#   dbus   - Freedesktop Secret Service (GNOME Keyring, KWallet, KeePassXC). Persistent across reboots. (Recommended)
#   kernel - Linux kernel keyutils. Stored in volatile RAM, cleared on reboot.
#
# If left commented out, the launcher wrapper automatically detects if a
# D-Bus Secret Service is running and defaults to 'dbus' to prevent session loss on reboot.
#PROTON_PASS_LINUX_KEYRING=dbus
