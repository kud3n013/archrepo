# Flags for Beeper (Electron)
# Place user overrides in ~/.config/beeper-flags.conf (overrides /etc/beeper-flags.conf)

# Display server backend (Wayland / X11):
# By default, beeper launcher automatically detects your desktop environment:
#   - On KDE Plasma (Wayland/X11): runs via X11/XWayland to allow KDE Global Menu export.
#   - On other Wayland compositors (Hyprland, Sway, GNOME): runs via native Wayland.
# Uncomment below if you wish to force native Wayland on all desktops:
# --ozone-platform-hint=auto
# --enable-wayland-ime

# Optional: Custom UI scaling for High-DPI screens (e.g. 1.5, 2.0)
# --force-device-scale-factor=1.5

# Optional: Disable GPU hardware acceleration if encountering driver rendering glitches
# --disable-gpu
