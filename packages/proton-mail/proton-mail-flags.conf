# Configuration flags for Proton Mail (Electron / Chromium)
#
# Place your overrides in ~/.config/proton-mail-flags.conf. If that file exists,
# it is used instead of this one. One flag per line; lines starting with '#' are ignored.

# Display server backend. The launcher picks native Wayland automatically in a
# Wayland session, unless a --ozone-platform flag is set here or on the command line.
# --ozone-platform=wayland
# --ozone-platform=x11

# High-DPI UI scaling factor (e.g. 1.25, 1.5, 2.0)
# --force-device-scale-factor=1.5

# Password store backend (gnome-libsecret, kwallet6, basic)
# --password-store=gnome-libsecret

# Hardware acceleration is turned off in the app instead: File > Disable Hardware Acceleration.

# Not a flag: set PROTON_MAIL_TRAY=0 in the environment to turn off the tray icon.
# Closing the window then quits the app, as upstream does.

# Not a flag: set PROTON_MAIL_THEME_SYNC=0 in the environment to stop the app's
# "Auto" theme from following the desktop's light/dark setting live.
