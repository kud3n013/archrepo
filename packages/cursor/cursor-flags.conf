# Configuration flags for Cursor (Electron / Chromium)
#
# Place your user overrides in ~/.config/cursor-flags.conf (overrides /etc/cursor-flags.conf)
# Lines starting with '#' are ignored.

# Display server backend (Wayland / X11)
# Cursor launcher enables native Wayland automatically when WAYLAND_DISPLAY is present.
# You can override or adjust Wayland flags here:
# --ozone-platform-hint=auto
# --ozone-platform=wayland
# --ozone-platform=x11
# --enable-wayland-ime

# High-DPI UI scaling factor (e.g. 1.25, 1.5, 2.0)
# --force-device-scale-factor=1.5

# GPU hardware acceleration options
# --enable-features=VaapiVideoDecodeLinuxGL
# --ignore-gpu-blocklist
# --enable-zero-copy
# --disable-gpu

# Password store / Secret Service backend (gnome-libsecret, kwallet5, kwallet6, basic)
# --password-store=basic
