# Configuration flags and environment variables for Sine
#
# Lines starting with '#' are ignored. Empty lines are ignored.
# Environment variables can be defined as KEY=VALUE.
# Command-line arguments can be added as single lines.
#
# This file can be overridden on a per-user basis by creating:
# ~/.config/sine-flags.conf

# ==============================================================================
# UI & HiDPI Scaling Overrides
# ==============================================================================
# By default, Sine automatically detects display scale from Wayland compositors
# (Hyprland, Sway, GNOME, KDE Plasma, wlroots) or X11 physical dimensions and
# synchronizes Xft.dpi for GLFW / ImGui.
#
# To manually override the scale factor, uncomment one of the following:
# SINE_SCALE=2.0
# SINE_SCALE=1.5
# SINE_DPI=192

# ==============================================================================
# Platform & Display Options:
# ==============================================================================
# Force Wayland or X11 backend for GLFW:
# GLFW_PLATFORM=wayland
# GLFW_PLATFORM=x11
