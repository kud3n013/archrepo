# Flags for GDLauncher Carbon (Electron) on Wayland / Hyprland
# Place user overrides in ~/.config/gdlauncher-carbon-flags.conf

--ozone-platform-hint=auto
--enable-wayland-ime

# Optional: custom UI scaling for High-DPI screens (e.g. 2.8k display)
# --force-device-scale-factor=1.5

# Optional: disable GPU acceleration if experiencing rendering issues
# --disable-gpu
