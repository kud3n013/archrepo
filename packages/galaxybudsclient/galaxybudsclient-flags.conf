# Configuration flags and environment variables for Galaxy Buds Manager
# Place user overrides in ~/.config/galaxybudsclient-flags.conf
#
# Environment variables (KEY=VALUE syntax):
#
# High-DPI & Display Scaling:
# Note: Display scaling on Wayland compositors (Hyprland, Sway, KDE, etc.) is
# automatically detected and applied at runtime. Uncomment below only to force
# a manual scale factor:
# AVALONIA_GLOBAL_SCALE_FACTOR=1.8
# AVALONIA_SCREEN_SCALE_FACTORS=eDP-1=1.8;DP-1=1.0
#
# Workaround for Avalonia font crashes on minimal systems with incomplete locale fonts:
# LC_ALL=C
#
# Command-line flags (passed directly to the application):
# Start minimized to system tray:
# /StartMinimized
