# Flags for Zalo (Electron 22), one per line.
# ~/.config/zalo-flags.conf, if it exists, is used instead of /etc/zalo-flags.conf.

# Display server:
#   - On KDE Plasma, Zalo runs under XWayland so that KWin draws its title bar and
#     its menu shows in the Plasma Global Menu. Electron 22 can't do either on
#     native Wayland.
#   - On other Wayland compositors it runs natively, with upstream's own window buttons.
# To force native Wayland on KDE too (no KWin title bar, no Global Menu):
# --ozone-platform=wayland
# --enable-wayland-ime

# Custom UI scaling for high-DPI screens:
# --force-device-scale-factor=1.5

# Environment variables (set them in the environment, not in this file):
#   ZALO_THEME_SYNC=0       don't follow the system light/dark setting live
#                           (upstream's slower built-in sync takes over)
#   ZALO_INPAGE_TITLEBAR=1  keep Zalo's own "Zalo - name" bar under the KWin title bar
