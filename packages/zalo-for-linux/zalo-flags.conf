# Configuration flags for Zalo (Electron 22 / Chromium)
#
# Place your overrides in ~/.config/zalo-flags.conf. If that file exists, it is
# used instead of this one. One flag per line; lines starting with '#' are ignored.

# Display server backend. Without a --ozone-platform flag here or on the command line,
# the launcher picks one in a Wayland session:
#   - KDE Plasma: XWayland, for KWin's title bar and the Global Menu.
#   - Other compositors: native Wayland, with window buttons drawn in the page.
# --ozone-platform=wayland
# --ozone-platform=x11

# High-DPI UI scaling factor (e.g. 1.25, 1.5, 2.0).
# --force-device-scale-factor=1.5

# Not flags: these environment variables each turn off one archrepo change
# (see docs/zalo-for-linux.md).
#   ZALO_GLOBALMENU=0        no application menu, so nothing in the Global Menu
#   ZALO_NATIVE_TITLEBAR=0   keep Zalo's own title bar strip in the page
#   ZALO_THEME_SYNC=0        do not follow the system light/dark setting
