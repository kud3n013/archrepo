# Flags for Zalo (Electron)
# Place user overrides in ~/.config/zalo-flags.conf (overrides /etc/zalo-flags.conf)

# Display server backend (Wayland / X11):
# By default, zalo launcher automatically detects your desktop environment:
#   - On KDE Plasma (Wayland/X11): runs via X11/XWayland to allow KDE Global Menu export.
#   - On other Wayland compositors (Hyprland, Sway, GNOME): runs via native Wayland.
# Uncomment below if you wish to force native Wayland on all desktops:
# --ozone-platform-hint=auto
# --enable-wayland-ime

# Optional: custom UI scaling for High-DPI screens (e.g. 2.8k display)
# --force-device-scale-factor=1.5

# Optional: disable Wine call bridge completely (saves background CPU/RAM if calls are not needed)
# ZCALL_DISABLE=1
