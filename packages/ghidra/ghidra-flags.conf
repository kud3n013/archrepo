# Options for the Ghidra launcher (/usr/bin/ghidra).
# Copy this file to ~/.config/ghidra-flags.conf to override it for your user.
#
# Lines starting with '-' are Java VM options. They are applied after Ghidra's
# own /opt/ghidra/support/launch.properties, so they win over its defaults.
# An option can't contain spaces.
# Lines of the form NAME=value set an environment variable, unless it is
# already set in the environment Ghidra was started from.

# HiDPI: Ghidra pins the UI scale to 1. The launcher follows GDK_SCALE, or
# Xft.dpi (192 dpi and up), on its own; set a scale here to force one.
# -Dsun.java2d.uiScale=2

# Bigger fonts without scaling the whole UI (point size).
# -Dfont.size.override=14

# Maximum Java heap for the GUI (default: a quarter of your RAM).
# GHIDRA_GUI_MAXMEM=8G

# Blank or grey windows on a tiling window manager. The launcher sets this on
# Sway, Hyprland, niri, river, i3, bspwm, xmonad and similar; set it here
# for one it doesn't know.
# _JAVA_AWT_WM_NONREPARENTING=1
