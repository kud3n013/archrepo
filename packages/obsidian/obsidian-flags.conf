# Flags for Obsidian (Electron)
# Place user overrides in ~/.config/obsidian-flags.conf (overrides /etc/obsidian-flags.conf)

# Display server backend (Wayland / X11):
# By default, obsidian launcher automatically detects your desktop environment:
#   - On KDE Plasma (Wayland/X11): runs via X11/XWayland to allow KDE Global Menu export.
#   - On other Wayland compositors (Hyprland, Sway, GNOME): runs via native Wayland.
# Uncomment below if you wish to force native Wayland on all desktops:
# --ozone-platform-hint=auto
# --enable-wayland-ime

# Optional: custom UI scaling for High-DPI screens (e.g. 2.8k / 4k displays)
# --force-device-scale-factor=1.5

# Optional: Chromium password store backend flag
# --password-store=basic
