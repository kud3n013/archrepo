# Configuration flags for Claude Desktop (Electron / Chromium)
#
# Place your overrides in ~/.config/claude-desktop-flags.conf. If that file exists,
# it is used instead of this one. One flag per line; lines starting with '#' are ignored.

# Display server backend. The launcher picks native Wayland automatically in a
# Wayland session, unless a --ozone-platform flag is set here or on the command line.
# --ozone-platform=wayland
# --ozone-platform=x11

# High-DPI UI scaling factor (e.g. 1.25, 1.5, 2.0)
# --force-device-scale-factor=1.5

# Password store backend (gnome-libsecret, kwallet6, basic). On KDE Plasma the app
# selects kwallet by itself unless this is set.
# --password-store=basic

# Not a flag: set CLAUDE_DESKTOP_CSD=1 in the environment to keep the app's own
# frameless title bar instead of the window manager's (see docs/claude-desktop.md).
