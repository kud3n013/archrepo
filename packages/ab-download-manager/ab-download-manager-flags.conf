# Environment and arguments for AB Download Manager.
# Copy to ~/.config/ab-download-manager-flags.conf to override per user.
# KEY=VALUE lines are exported (a variable already set in the environment wins);
# other lines are passed to the app as arguments. '#' starts a comment.

# Skia render backend. SOFTWARE avoids the black window that OpenGL shows on
# many Wayland/XWayland and NVIDIA setups. Try OPENGL for GPU rendering.
SKIKO_RENDER_API=SOFTWARE
# SKIKO_RENDER_API=OPENGL

# JVM options, e.g. HiDPI scaling when the desktop's scale is not picked up:
# _JAVA_OPTIONS=-Dsun.java2d.uiScale=2
