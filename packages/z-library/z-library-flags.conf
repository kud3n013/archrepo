# Configuration flags for the Z-Library desktop app (Electron / Chromium)
#
# Place your overrides in ~/.config/z-library-flags.conf. If that file exists,
# it is used instead of this one. One flag per line; lines starting with '#' are ignored.

# Display server backend. In a Wayland session the launcher picks XWayland on KDE
# Plasma (for the Global Menu) and native Wayland elsewhere, unless a
# --ozone-platform flag is set here or on the command line.
# --ozone-platform=wayland
# --ozone-platform=x11

# High-DPI UI scaling factor (e.g. 1.25, 1.5, 2.0)
# --force-device-scale-factor=1.5

# Disable GPU acceleration if you see driver rendering glitches.
# --disable-gpu

# Not flags: environment variables read by the package (see docs/z-library.md).
#   Z_LIBRARY_CSD=1         keep upstream's frameless window, in-page window buttons and menu
#   Z_LIBRARY_GLOBALMENU=0  on KDE Wayland, run native Wayland (no Global Menu)
