# Flags for Triggers Client (Tauri / WebKitGTK)
# Place user overrides in ~/.config/triggers-client-flags.conf (overrides /etc/triggers-client-flags.conf)
#
# KEY=VALUE lines are exported as environment variables; other lines are passed
# to the app as arguments. Chromium/Electron switches such as --ozone-platform
# have no effect: the app follows the session (Wayland or X11) through GTK.

# Optional: blank or flickering window, mostly on NVIDIA under Wayland
# WEBKIT_DISABLE_DMABUF_RENDERER=1

# Optional: rendering glitches with GPU compositing
# WEBKIT_DISABLE_COMPOSITING_MODE=1

# Optional: run through XWayland instead of native Wayland
# GDK_BACKEND=x11

# Optional: integer UI scaling for High-DPI screens
# GDK_SCALE=2
