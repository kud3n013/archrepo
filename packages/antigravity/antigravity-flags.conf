# Flags for Google Antigravity (Electron) on Wayland / Hyprland / KDE Plasma
# Place user overrides in ~/.config/antigravity-flags.conf (overrides /etc/antigravity-flags.conf)

--ozone-platform-hint=auto
--enable-wayland-ime

# Window controls and menu bar styling:
# In-window menu bar is hidden by default to keep the UI clean:
#   - Reveals as native GTK/Qt menu when tapping the Alt key
#   - Automatically exports via D-Bus to KDE Plasma Global Menu widget
#
# --titlebar=native   # Default: Use native GTK/Qt system window frame and system/global menu
# --titlebar=hidden   # Frameless: Hide title bar and window controls (recommended for tiling WMs)
# --titlebar=overlay  # Upstream default: frameless with Chromium Window Controls Overlay (WCO)
--titlebar=native

# Optional: Custom UI scaling for High-DPI screens (e.g. 1.5, 2.0)
# --force-device-scale-factor=1.5

# Optional: Disable GPU hardware acceleration if encountering driver rendering glitches
# --disable-gpu
