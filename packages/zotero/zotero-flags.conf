# ==============================================================================
# Zotero User Configuration Flags
# Located at ~/.config/zotero-flags.conf (overrides /etc/zotero-flags.conf)
# ==============================================================================

# --- Wayland Integration ---
# Enable native Wayland backend under Wayland compositors (Hyprland, KDE Wayland)
MOZ_ENABLE_WAYLAND=1
# Wayland remoting name (matches zotero.desktop and ensures correct taskbar/titlebar icon)
MOZ_APP_REMOTINGNAME=zotero

# --- Desktop Environment / Theme Auto-Detection Override ---
# By default, zotero.sh automatically detects whether you are running under
# Hyprland (native GTK theme) or KDE Plasma (Qt/Breeze theme & Global Menu).
# You can force a specific mode here:
# ZOTERO_DESKTOP_ENV=kde
# ZOTERO_DESKTOP_ENV=hyprland

# --- In-Window Menu Bar Mode ---
# Options:
#   autohide (default on both KDE Plasma and Hyprland):
#     Menu bar is hidden in-window by default to keep the interface clean.
#     - Tap 'Alt' key to reveal and focus the menubar (tap Alt again or Esc to hide).
#     - Press 'F10' to focus the menubar.
#     - Press 'Alt+F', 'Alt+E', 'Alt+V', 'Alt+T', 'Alt+H' to directly open menu dropdowns.
#     - Press 'Ctrl+M' at any time inside Zotero to toggle permanent visibility.
#   visible:
#     Always keep the menu bar visible inside the window.
#   hidden:
#     Permanently hidden inside the window.
# ZOTERO_MENUBAR=autohide
# Or force-hide:
# ZOTERO_HIDE_MENUBAR=1
#
# --- KDE Plasma Global Menu (D-Bus Export) ---
# By default, Zotero exports application menus over D-Bus to the KDE Global Menu
# widget while simultaneously supporting the in-window Alt/F10 key reveal.
# If you want to disable D-Bus Global Menu export, set:
# ZOTERO_GLOBAL_MENU=0

# --- GTK Theme Override ---
# Explicitly choose GTK theme (e.g. Breeze, Breeze-Dark, adw-gtk3-dark):
# GTK_THEME=Breeze-Dark

# --- Desktop Portal Integration ---
# Enable XDG Desktop Portal for native KDE/Hyprland file dialogs:
GTK_USE_PORTAL=1

# --- HiDPI / Scaling Overrides ---
# GDK_SCALE=1
# GDK_DPI_SCALE=1
